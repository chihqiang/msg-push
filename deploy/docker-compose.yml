# msg-push 基础服务（MySQL + Redis）
# 用法：
#   启动：docker compose -f deploy/docker-compose.yml up -d
#   停止：docker compose -f deploy/docker-compose.yml down
#   查看：docker compose -f deploy/docker-compose.yml ps
#
# 服务连接信息（对应 config.yaml 默认值）：
#   MySQL: 127.0.0.1:3306  root / msgpush123456  库名 msg_push
#   Redis: 127.0.0.1:6379（无密码）
#
# 密码等敏感信息可通过环境变量覆盖：MYSQL_ROOT_PASSWORD / MYSQL_DATABASE

services:
  mysql:
    image: mysql:8.0
    container_name: msgpush-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-msgpush123456}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-msg_push}
      # 使用 utf8mb4 以支持完整 Unicode（表情等）
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${MYSQL_ROOT_PASSWORD:-msgpush123456}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: msgpush-redis
    restart: unless-stopped
    # 本地开发默认无密码；如需密码，取消注释并设置 requirepass
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  mysql-data:
  redis-data:
