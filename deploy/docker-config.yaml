# msg-push 容器配置
# 所有连接信息通过环境变量覆盖（conf.UseEnv() 会展开 ${VAR} 占位符）。
# 未设置环境变量时，使用 Dockerfile 中声明的默认值（DB_HOST=mysql / REDIS_ADDR=redis:6379）。
# 建议在部署时至少覆盖：DB_PASSWORD、JWT_SECRET、ACCOUNT_SEED_PASSWORD。

# HTTP 服务配置（嵌入 rest.Config，键位于配置顶层）
host: ${SERVER_HOST}
port: ${SERVER_PORT}
health:
  enabled: true
  path: /health

name: msg-push
env: ${APP_ENV}

logger:
  # 日志级别：debug / info / error / severe
  level: info
  # 输出模式：console（控制台）/ file（文件）/ volume
  mode: console
  # 输出格式：plain（可读文本）/ json
  encoding: plain
  serviceName: msg-push

db:
  driver: mysql
  host: ${DB_HOST}
  port: ${DB_PORT}
  username: ${DB_USER}
  password: ${DB_PASSWORD}
  database: ${DB_NAME}
  maxIdleConns: 10
  maxOpenConns: 100

redis:
  addr: ${REDIS_ADDR}
  keyPrefix: msg-push

jwt:
  secret: ${JWT_SECRET}
  issuer: msg-push
  access_token_expire: 2h
  refresh_token_expire: 168h

taskq:
  # 注意：键名需与 Go 字段匹配（ten-go mapping 按字段名 canonical 匹配），
  # snake_case（如 redis_addr）无法注入 RedisAddr 字段，会回退到默认 127.0.0.1:6379。
  redisAddr: ${TASKQ_REDIS_ADDR}
  concurrency: 10
  defaultMaxRetry: 3
  defaultTimeout: 30m
  defaultQueue: default

# 账号种子（仅首次建库时创建）
account_seed:
  username: ${ACCOUNT_SEED_USERNAME}
  password: ${ACCOUNT_SEED_PASSWORD}
